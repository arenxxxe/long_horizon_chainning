defaults:
  - sl_agent@agent: sl_dex
  - _self_

# File path
cwd: ${hydra:runtime.output_dir}

# Training params
n_train_steps: 50_000_000
n_eval: 4000
n_save: 1600
n_log: 40000
num_demo: 200
eval_frequency: 2_000
n_seed_steps: 200

replay_buffer_capacity: 100_000
checkpoint_frequency: 20_000
update_epoch: 80
batch_size: 128
device: cuda:0
seed: 1
task: 'PandaGrasp-v0'
subtask: release
postfix: null
skill_chaining: False
dont_save: False
n_eval_episodes: 8
save_buffer: False

use_wb: True
project_name: panda_skill_learning
entity_name: qinsongwei90

mpi: {rank: null, is_chef: null, num_workers: null}
# Working space
hydra:
  run:
    dir: ./exp/skill_learning/${task}/${agent.name}/d${num_demo}/s${seed}/${subtask}
  sweep:
    dir: ./exp/skill_learning/${task}/${agent.name}/d${num_demo}/s${seed}
    subdir: ${subtask}
  sweeper:
    params:
      seed: 1,2,3,4,5
      subtask: grasp,release
